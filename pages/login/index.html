<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>Sign In | BNPT IPDR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="../../css/adminlte.min.css" />
  <link rel="stylesheet" href="../../css/bnpt-theme.css" />
</head>
<body class="login-page">
  <div class="login-box">
    <div class="login-logo text-center mb-3">
      <i class="bi bi-shield-lock-fill text-primary fs-1"></i>
      <div class="fw-bold fs-4 mt-2 text-white">BNPT <span class="text-primary">IPDR</span></div>
      <div class="text-secondary fs-13">Vector Filtering Engine</div>
    </div>

    <div class="card">
      <div class="card-body login-card-body">
        <p class="login-box-msg text-secondary">Sign in to access the IPDR Operations Portal</p>

        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="mb-3">
            <label class="form-label fs-13 text-secondary">Username</label>
            <div class="input-group">
              <span class="input-group-text bg-transparent"><i class="bi bi-person-fill"></i></span>
              <input type="text" id="inputUsername" class="form-control" placeholder="e.g. analyst_budi" required autofocus>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label fs-13 text-secondary">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-transparent"><i class="bi bi-lock-fill"></i></span>
              <input type="password" id="inputPassword" class="form-control" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required>
            </div>
          </div>

          <div id="loginError" class="alert alert-danger py-2 fs-13 d-none">
            <i class="bi bi-exclamation-triangle-fill me-1"></i> Username atau password salah.
          </div>

          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rememberMe">
              <label class="form-check-label fs-13 text-secondary" for="rememberMe">Remember me</label>
            </div>
          </div>

          <button type="submit" class="btn btn-primary d-block w-100">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
          </button>
        </form>

        <p class="text-center text-secondary fs-12 mt-3 mb-0">
          Akses dikendalikan oleh Admin BNPT. Hubungi tim DevOps bila lupa kata sandi.
        </p>
      </div>
    </div>

    <p class="text-center text-secondary fs-11 mt-3">
      &copy; 2026 BNPT IPDR Vector Filtering Engine
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>
  <script>
    // TODO: ganti dengan POST ke backend /auth/login (NestJS), simpan JWT, lalu redirect
    function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('inputUsername').value;
      // Demo only: langsung redirect ke dashboard tanpa validasi asli
      window.location.href = '../../index.html';
    }
  </script>
</body>
</html>
